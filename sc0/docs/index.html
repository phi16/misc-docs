<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SC0 Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="vendor/docsify-theme-simple.css">
  <style>
    :root {
      --base-font-size: 15px;
      --content-max-width: 58em;
    }
    code { font-family: Consolas, "Cascadia Mono", monospace; }
  </style>
</head>
<body>
  <div id="app">読み込み中…</div>
  <script>
    window.$docsify = {
      name: 'SC0',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: '検索',
        noData: '見つかりません',
        depth: 3,
      },
    };
  </script>
  <script src="vendor/docsify.min.js"></script>
  <script src="vendor/search.min.js"></script>

</html>
